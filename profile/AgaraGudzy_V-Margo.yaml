proxy-groups:
  - name: VPN
    type: select
    interval: 800
    url: http://www.gstatic.com/generate_204
    icon: https://cdn.jsdelivr.net/gh/JollyDogy/AgaraGudzy/icon/CheburNET.png
    proxies:
#градация от лучшего до худшего варианта использования      
      - WARP If
      #- zapas
      - WARPServer

#Запасной вариант на случай нестабильности WARP
  - name: WARP If
    type: fallback
    interval: 450
    hidden: true
    url: http://www.gstatic.com/generate_204
    proxies:
      - WARP
      - WARPServer

  - name: WARP
    type: fallback
    interval: 30
    hidden: false
    url: http://speed.cloudflare.com/
    use:
      - WARPStandart

#Отдельный скрипт для минимального пинга Discord
  - name: Discord
    type: url-test
    interval: 20
    tolerance: 8
    hidden: true
    url: http://gateway-us-east1-d.discord.gg
    #use:
    #  - zapasList
    proxies:
      - WARP

#Отдельно для игр
  - name: Games
    type: url-test
    interval: 15
    tolerance: 20
    hidden: true
    url: https://cp.cloudflare.com/generate_204
    use:
      - zapasList    

#Запасные VPN
  - name: zapas
    type: fallback
    interval: 30
    #tolerance: 50
    hidden: true
    url: http://www.gstatic.com/generate_204
    icon: https://cdn.jsdelivr.net/gh/JollyDogy/AgaraGudzy/icon/WhiteList.png
    use:
      - 'zapasList'

#WARPserver
  - name: WARPServer
    type: fallback
    interval: 60
    url: http://www.gstatic.com/generate_204
    icon: https://cdn.jsdelivr.net/gh/JollyDogy/AgaraGudzy/icon/WhiteList.png
    proxies:
      - '🇵🇱 Польша'
      - '🇱🇻 Латвия2'
      - '🇳🇱 Нидерланды'
      - '🇩🇪 Германия'
      - '🇫🇮 Финляндия'

  - name: '🇫🇮 Финляндия'
    type: fallback
    interval: 50
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "🇫🇮"     

  - name: '🇵🇱 Польша'
    type: fallback
    interval: 50
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "🇵🇱"

  - name: '🇳🇱 Нидерланды'
    type: fallback
    interval: 50
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "🇳🇱"    

  - name: '🇩🇪 Германия'
    type: fallback
    interval: 50
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "🇩🇪"            

  - name: '🇱🇻 Латвия2'
    type: fallback
    interval: 50
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "🇱🇻"

rule-providers:
  RulesZapas:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/rules/RulesZapas.yaml
    path: ./rules/RulesZapas.yaml
    interval: 21600

  RulesVPN:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/rules/RulesVPN.yaml
    path: ./rules/RulesVPN.yaml
    interval: 21600
 
  RulesDIRECT:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/rules/RulesDirect.yaml
    path: ./rules/RulesDIRECT.yaml
    interval: 21600
  
  RulesVPNexe:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/rules/rulesVPNexe.yaml
    path: ./rules/RulesVPNexe.yaml
    interval: 21600  

