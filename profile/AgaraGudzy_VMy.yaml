health-check:
  enable: true
  lazy: true
  timeout: 1000
  url: http://speed.cloudflare.com/
  
tcp-concurrent: false

proxy-providers:
  WARPStandart:
    type: http
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/proxies/WARP/WARPStandart.yaml
    interval: 21600
    path: ./providers/WARPStandart.yaml    

  WARPServers:
    type: http
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/proxies/WARP/WARPServer.yaml
    interval: 21600
    path: ./providers/WARPServers.yaml 

proxy-groups:
  - name: VPN
    type: select
    interval: 800
    url: http://www.gstatic.com/generate_204
    icon: https://cdn.jsdelivr.net/gh/JollyDogy/AgaraGudzy/icon/CheburNET.png
    proxies:
#градация от лучшего до худшего варианта использования      
      - WARP
      - WARPServer

#Запасной вариант на случай нестабильности WARP
  - name: WARP
    type: fallback
    #strategy: consistent-hashing
    interval: 180
    hidden: false
    url: http://speed.cloudflare.com/
    use:
      - WARPStandart

#WARPserver
  - name: WARPServer
    type: load-balance
    hidden: false
    interval: 160
    url: http://www.gstatic.com/generate_204
    icon: https://cdn.jsdelivr.net/gh/JollyDogy/AgaraGudzy/icon/WhiteList.png
    proxies:
      - '🇵🇱 Польша-1'
      - '🇩🇪 Германия-1'
      - '🇵🇱 Польша-2'
      - '🇩🇪 Германия-2'

  - name: '🇵🇱 Польша-1'
    type: fallback
    interval: 200
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "Польша"

  - name: '🇵🇱 Польша-2'
    type: fallback
    interval: 200
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "Польша_2"    

  - name: '🇩🇪 Германия-1'
    type: fallback
    interval: 200
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "Германия"
    
  - name: '🇩🇪 Германия-2'
    type: fallback
    interval: 200
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "Германия_2"  

rule-providers:
  RulesZapas:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/rules/RulesZapas.yaml
    path: ./rules/RulesZapas.yaml
    interval: 21600

  RulesVPN:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/rules/RulesVPN.yaml
    path: ./rules/RulesVPN.yaml
    interval: 21600
 
  RulesDIRECT:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/rules/RulesDirect.yaml
    path: ./rules/RulesDIRECT.yaml
    interval: 21600
  
  RulesVPNexe:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/rules/rulesVPNexe.yaml
    path: ./rules/RulesVPNexe.yaml
    interval: 21600  

rules: 
#Персональные правила 
  #- PROCESS-NAME,obs-browser-page.exe,WARPServer
  #- "DOMAIN-KEYWORD,openport,🇩🇪 Германия-1"
  - DOMAIN-KEYWORD,avatar.roblox,WARPServer
  - DOMAIN-KEYWORD,contentdelivery.roblox,WARPServer
  - DOMAIN-KEYWORD,images.rbxcdn,WARPServer
  - DOMAIN-KEYWORD,tr.rbxcdn,WARPServer
  - DOMAIN-KEYWORD,skinsrestorer,WARPServer
  - DOMAIN-KEYWORD,thumbnails.roblox,WARPServer
  - PROCESS-NAME,uTorrent.exe,VPN
  - PROCESS-NAME,Rambox.exe,DIRECT
  - DOMAIN-KEYWORD,streamelements,WARPServer
  - PROCESS-NAME,yt-dlp.exe,WARP
  - PROCESS-NAME,parsec.exe,DIRECT
  - PROCESS-NAME,Zapret.exe,DIRECT
  - DOMAIN-KEYWORD,warframe.market,WARP
  - PROCESS-NAME,EpicWebHelper.exe,WARP
  - PROCESS-NAME,EpicGamesLauncher.exe,WARP
  #- PROCESS-NAME,obs64.exe,WARP
#Игры
  - PROCESS-NAME,NuclearNightmare-Win64-Shipping.exe,WARP
  - PROCESS-NAME,Warframe.x64.exe,DIRECT
  - PROCESS-NAME,RobloxPlayerBeta.exe,DIRECT
  - PROCESS-NAME,prismlauncher.exe,WARP
  - PROCESS-NAME,VotV-Win64-Shipping.exe,DIRECT
  - PROCESS-NAME,DeadByDaylight.exe,DIRECT
  - DOMAIN-KEYWORD,warframe.com,DIRECT
  - PROCESS-NAME,REPO.exe,DIRECT
  - PROCESS-NAME,DeadByDaylight-Win64-Shipping.exe,DIRECT
  - PROCESS-NAME,PropWitchHuntModule-Win64-Shipping.exe,DIRECT
  #- PROCESS-NAME,java.exe,WARP
  - PROCESS-NAME,DOOMx64.exe,WARP
  - PROCESS-NAME,RPM-RolePlay.exe,WARP
  #- PROCESS-NAME,PEAK.exe,WARP
#VALORANT
  - "PROCESS-NAME,Riot Client.exe,WARP"
  - PROCESS-NAME,RiotClient.exe,WARP
  - PROCESS-NAME,VALORANT-Win64-Shipping.exe,VPN
  - PROCESS-NAME,RiotClientServices.exe,WARP
#YouTube
  - DOMAIN-KEYWORD,youtube.com,DIRECT
  - DOMAIN-KEYWORD,ytimg,WARPServer
  - DOMAIN-KEYWORD,ggpht,WARPServer
  - DOMAIN-KEYWORD,googleusercontent,WARPServer
  - DOMAIN-KEYWORD,googlevideo,DIRECT
#Отдельные правила для исполняемых файлов файлов
  - RULE-SET,RulesVPNexe,WARPServer
#Правила для прямых соединений
  - RULE-SET,RulesDIRECT,DIRECT
#Запасные правила на случай отказа работы от WARP
  - RULE-SET,RulesZapas,WARPServer
#Основные правила для обхода
  - RULE-SET,RulesVPN,VPN
#Discord
  - PROCESS-NAME,discord.exe,WARP
