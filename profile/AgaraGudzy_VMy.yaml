proxy-groups:
  - name: VPN
    type: select
    interval: 800
    url: http://www.gstatic.com/generate_204
    icon: https://cdn.jsdelivr.net/gh/JollyDogy/AgaraGudzy/icon/CheburNET.png
    proxies:
#градация от лучшего до худшего варианта использования      
      - WARP
      - Servers

  - name: Obhodnic
    type: fallback
    interval: 300
    url: http://www.gstatic.com/generate_204
    icon: https://cdn.jsdelivr.net/gh/JollyDogy/AgaraGudzy/icon/CheburNET.png
    proxies:
#градация от лучшего до худшего варианта использования      
      - Servers
      - WARPServer

#Запасной вариант на случай нестабильности WARP
  - name: WARP
    type: fallback
    interval: 160
    hidden: false
    url: http://speed.cloudflare.com/
    use:
      - WARPStandart

#Отдельный скрипт для минимального пинга Discord
  - name: Discord
    type: url-test
    interval: 20
    tolerance: 8
    hidden: true
    url: http://gateway-us-east1-d.discord.gg
    proxies:
      - WARP

#WARPserver
  - name: WARPServer
    type: url-test
    hidden: false
    interval: 120
    tolerance: 20
    url: http://www.gstatic.com/generate_204
    icon: https://cdn.jsdelivr.net/gh/JollyDogy/AgaraGudzy/icon/WhiteList.png
    proxies:
      - '🇵🇱 Польша'
      - '🇩🇪 Германия'

  - name: '🇵🇱 Польша'
    type: fallback
    interval: 90
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "🇵🇱"

  - name: '🇩🇪 Германия'
    type: fallback
    interval: 90
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "🇩🇪"            

