health-check:
  enable: true
  lazy: false
  timeout: 1500
  url: http://www.gstatic.com/generate_204
  
tcp-concurrent: false

proxy-providers:
  VLESSList:
    type: http
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/proxies/VLESSWhiteList.yaml
    interval: 21600
    path: ./providers/VLESSList.yaml

  WARPServers:
    type: http
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/proxies/WARP/WARPServer.yaml
    interval: 21600
    path: ./providers/WARPServers.yaml 

proxy-groups:
  - name: VPN
    type: fallback
    interval: 100
    hidden: false
    url: http://speed.cloudflare.com/
    proxies:
      - WARPServer
      - VLESS

#WARPserver
  - name: WARPServer
    type: load-balance
    hidden: false
    interval: 120
    url: http://www.gstatic.com/generate_204
    icon: https://cdn.jsdelivr.net/gh/JollyDogy/AgaraGudzy/icon/WhiteList.png
    proxies:
      - '🇵🇱 Польша'
      - '🇩🇪 Германия'
      - '🇫🇮 Финляндия'

  - name: '🇵🇱 Польша'
    type: fallback
    interval: 70
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "🇵🇱"

  - name: '🇩🇪 Германия'
    type: fallback
    interval: 70
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "🇩🇪"     
    
  - name: '🇫🇮 Финляндия'
    type: fallback
    interval: 70
    hidden: true
    url: http://www.gstatic.com/generate_204
    use:
      - 'WARPServers'
    filter: "🇫🇮"   

  - name: VLESS
    hidden: false
    type: fallback
    interval: 80
    url: http://www.gstatic.com/generate_204
    use:
      - VLESSList

rule-providers:
  RulesDIRECT:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/JollyDogy/AgaraGudzy/refs/heads/main/rules/RulesDirect.yaml
    path: ./rules/RulesDIRECT.yaml
    interval: 21600

rules:
  - RULE-SET,RulesDIRECT,DIRECT
  - MATCH,VPN
